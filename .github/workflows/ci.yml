name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: svontai_ci
          POSTGRES_USER: svontai
          POSTGRES_PASSWORD: svontai_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svontai -d svontai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pip_audit -r ../requirements.txt
      - run: python -m bandit -r app -ll
      - name: Verify Railway and backend dependencies stay aligned
        run: diff -u requirements.txt ../requirements.txt
      - name: Verify fresh database migrations
        run: DATABASE_URL=postgresql+psycopg://svontai:svontai_ci_password@127.0.0.1:5432/svontai_ci alembic upgrade head
      - run: python -m pytest -q
      - name: Verify reliability contracts on PostgreSQL
        run: python -m pytest tests/test_reliability_regressions.py tests/test_webhook_inbox.py tests/test_reply_quota.py tests/test_operator_delivery.py tests/test_capacity_contracts.py tests/test_realtime_capacity.py tests/test_pg_concurrency.py -q -s
        env:
          TEST_DATABASE_URL: postgresql+psycopg://svontai:svontai_ci_password@127.0.0.1:5432/svontai_ci
          TEST_REDIS_URL: redis://127.0.0.1:6379/15

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run security:verify
      - run: npm test
      - run: npm run check
      - run: npx --no-install expo export --platform ios --platform android --output-dir dist-check
      - run: npm audit --omit=dev --audit-level=high

  oracle-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate deployment scripts
        run: |
          bash -n deploy/oracle/scripts/*.sh
          python3 -m py_compile deploy/oracle/scripts/*.py
      - name: Validate production Compose contract
        run: |
          cp deploy/oracle/.env.oracle.example deploy/oracle/.env.oracle
          chmod 600 deploy/oracle/.env.oracle
          docker compose \
            --env-file deploy/oracle/.env.oracle \
            -f deploy/oracle/docker-compose.yml \
            config --quiet
