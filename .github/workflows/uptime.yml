name: Production Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://svontai-production.up.railway.app
      FRONTEND_URL: https://svontai.vercel.app
      SMARTWA_SMOKE_EMAIL: ${{ secrets.SMARTWA_SMOKE_EMAIL }}
      SMARTWA_SMOKE_PASSWORD: ${{ secrets.SMARTWA_SMOKE_PASSWORD }}
      SMARTWA_SMOKE_TENANT_ID: ${{ secrets.SMARTWA_SMOKE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Check public services
        run: |
          curl --fail --silent --show-error --max-time 20 "$BACKEND_URL/health/ready" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL/api/frontend-config" >/dev/null

      - name: Require protected smoke account
        run: |
          test -n "$SMARTWA_SMOKE_EMAIL"
          test -n "$SMARTWA_SMOKE_PASSWORD"
          test -n "$SMARTWA_SMOKE_TENANT_ID"

      - name: Run customer API smoke
        run: python scripts/prod_smoke.py

      - name: Open or update incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[uptime] SvontAI production smoke failed'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            })
            const body = `Production health check failed at ${new Date().toISOString()}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const existing = issues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime'],
              })
            }

      - name: Close recovered incident
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            })
            for (const issue of issues.filter((item) => item.title === '[uptime] SvontAI production smoke failed')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Production health checks recovered at ${new Date().toISOString()}.`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              })
            }
