name: Backup Restore Drill

# Audit A24: prove, on a schedule, that an archive produced by
# DatabaseBackupService can be decrypted and restored on a separate PostgreSQL
# server and still contains the critical tables. Runs weekly and on demand.
# Requires the repository secret BACKUP_DRILL_ENCRYPTION_KEY_B64 (a throw-away,
# base64-encoded 32-byte key; never the production key). Without it the job
# logs a notice and exits successfully.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: svontai_drill_source
          POSTGRES_USER: svontai
          POSTGRES_PASSWORD: svontai_drill_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svontai -d svontai_drill_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRILL_KEY: ${{ secrets.BACKUP_DRILL_ENCRYPTION_KEY_B64 }}
      SOURCE_URL: postgresql+psycopg://svontai:svontai_drill_password@127.0.0.1:5432/svontai_drill_source
      SCRATCH_URL: postgresql+psycopg://svontai:svontai_drill_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check drill secrets
        id: gate
        run: |
          if [ -z "$DRILL_KEY" ]; then
            echo "::notice::BACKUP_DRILL_ENCRYPTION_KEY_B64 is not configured; skipping the backup/restore drill"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL 17 client tools (pg_dump/pg_restore must match the server major)
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements.txt

      - name: Migrate and seed the source database
        if: steps.gate.outputs.run == 'true'
        run: |
          (cd backend && DATABASE_URL="$SOURCE_URL" alembic upgrade head)
          python scripts/restore_drill.py seed --database-url "$SOURCE_URL" --messages 25

      - name: Create an encrypted archive with DatabaseBackupService
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          DATABASE_BACKUP_ENCRYPTION_KEY_B64: ${{ env.DRILL_KEY }}
        run: python scripts/restore_drill.py create-archive --output drill/database.dump.aes256gcm

      - name: Restore the archive on the scratch server and verify contents
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_BACKUP_ENCRYPTION_KEY_B64: ${{ env.DRILL_KEY }}
        run: |
          python scripts/restore_drill.py restore drill/database.dump.aes256gcm \
            --database-url "$SCRATCH_URL" \
            --min-tenants 1 --min-users 1 --min-messages 25 \
            --result-json drill/result.json

      - name: Upload drill evidence (manifest and result, no data)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-drill-${{ github.run_id }}
          path: |
            drill/database.dump.aes256gcm.json
            drill/result.json
          if-no-files-found: warn
          retention-days: 90
