name: Encrypted Database Backup

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-test
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESTORE_DATABASE_URL: postgresql://postgres:restore-test@127.0.0.1:5432/restore_test
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup secrets
        run: test -n "$PRODUCTION_DATABASE_URL" && test -n "$BACKUP_ENCRYPTION_KEY"
      - name: Create production dump
        run: pg_dump "$PRODUCTION_DATABASE_URL" --format=custom --no-owner --no-privileges --file=/tmp/svontai.dump
      - name: Encrypt backup
        run: openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/svontai.dump -out /tmp/svontai.dump.enc -pass env:BACKUP_ENCRYPTION_KEY
      - name: Restore into isolated PostgreSQL
        run: pg_restore --dbname="$RESTORE_DATABASE_URL" --no-owner --no-privileges /tmp/svontai.dump
      - name: Verify restored schema
        run: |
          test "$(psql "$RESTORE_DATABASE_URL" -Atc 'select version_num from alembic_version')" = "041"
          psql "$RESTORE_DATABASE_URL" -Atc "select to_regclass('public.tenants'), to_regclass('public.users'), to_regclass('public.messages'), to_regclass('public.sales_inquiries')" | grep -q 'tenants'
      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: svontai-postgres-${{ github.run_id }}
          path: /tmp/svontai.dump.enc
          retention-days: 14
          if-no-files-found: error

      - name: Open backup incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[backup] PostgreSQL backup or restore verification failed'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup',
            })
            const body = `Backup verification failed at ${new Date().toISOString()}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const existing = issues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['backup'] })
            }
