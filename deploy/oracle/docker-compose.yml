name: svontai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  logging: *default-logging

x-backend-common: &backend-common
  <<: *app-security
  build:
    context: ../..
    dockerfile: deploy/oracle/Dockerfile.backend
  env_file:
    - ./.env.oracle
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: ${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    N8N_BASE_URL: http://n8n:5678
    OPENWA_BASE_URL: http://openwa:2785
    OPENWA_WEBHOOK_PUBLIC_URL: https://${API_DOMAIN}
  networks:
    - private
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    <<: *app-security
    image: caddy:2.10.2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      VOICE_DOMAIN: ${VOICE_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    mem_limit: 256m
    cpus: 0.20
    pids_limit: 128
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    <<: *app-security
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${FRONTEND_DOMAIN}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_LEGAL_ENTITY_NAME: ${NEXT_PUBLIC_LEGAL_ENTITY_NAME}
        NEXT_PUBLIC_LEGAL_ENTITY_ADDRESS: ${NEXT_PUBLIC_LEGAL_ENTITY_ADDRESS}
        NEXT_PUBLIC_LEGAL_ENTITY_TAX_OFFICE: ${NEXT_PUBLIC_LEGAL_ENTITY_TAX_OFFICE}
        NEXT_PUBLIC_LEGAL_ENTITY_TAX_NUMBER: ${NEXT_PUBLIC_LEGAL_ENTITY_TAX_NUMBER}
        NEXT_PUBLIC_LEGAL_ENTITY_MERSIS_NUMBER: ${NEXT_PUBLIC_LEGAL_ENTITY_MERSIS_NUMBER}
        NEXT_PUBLIC_LEGAL_ENTITY_TRADE_REGISTRY_NUMBER: ${NEXT_PUBLIC_LEGAL_ENTITY_TRADE_REGISTRY_NUMBER}
        NEXT_PUBLIC_LEGAL_ENTITY_KEP_ADDRESS: ${NEXT_PUBLIC_LEGAL_ENTITY_KEP_ADDRESS}
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${NEXT_PUBLIC_LEGAL_CONTACT_EMAIL}
        NEXT_PUBLIC_LEGAL_CONTACT_PHONE: ${NEXT_PUBLIC_LEGAL_CONTACT_PHONE}
    environment:
      NEXT_PUBLIC_BACKEND_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_SITE_URL: https://${FRONTEND_DOMAIN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    expose:
      - "3000"
    networks:
      - edge
    mem_limit: 512m
    cpus: 0.40
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    <<: *backend-common
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      N8N_BASE_URL: http://n8n:5678
      OPENWA_BASE_URL: http://openwa:2785
      OPENWA_WEBHOOK_PUBLIC_URL: https://${API_DOMAIN}
      SERVICE_ROLE: api
      RUN_SCHEDULED_JOBS_IN_WEB: "false"
    expose:
      - "8000"
    networks:
      - edge
      - private
    volumes:
      - legacy-artifacts:/app/storage
    mem_limit: 1g
    cpus: 0.70
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:
    <<: *backend-common
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      N8N_BASE_URL: http://n8n:5678
      OPENWA_BASE_URL: http://openwa:2785
      OPENWA_WEBHOOK_PUBLIC_URL: https://${API_DOMAIN}
      SERVICE_ROLE: worker
      RUN_SCHEDULED_JOBS_IN_WEB: "false"
    volumes:
      - legacy-artifacts:/app/storage
    networks:
      - private
      - worker-egress
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_healthy
      openwa:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 256

  voice-gateway:
    <<: *app-security
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.voice
    env_file:
      - ./.env.oracle
    environment:
      PORT: "9001"
      SVONTAI_BACKEND_URL: http://api:8000
      VOICE_GATEWAY_PUBLIC_URL: https://${VOICE_DOMAIN}
    expose:
      - "9001"
    networks:
      - edge
      - private
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    <<: *app-security
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    mem_limit: 1536m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *app-security
    image: redis:7.4.5-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - private
    mem_limit: 256m
    cpus: 0.20
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *app-security
    image: n8nio/n8n:2.30.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "8"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_TIMEOUT: "120"
      EXECUTIONS_TIMEOUT_MAX: "300"
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
    expose:
      - "5678"
      - "5679"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../../n8n/workflows:/files/workflows:ro
    networks:
      - edge
      - private
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1280m
    cpus: 0.60
    pids_limit: 512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n-runners:
    <<: *app-security
    image: n8nio/runners:2.30.7
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    networks:
      - private
      - runner-egress
    depends_on:
      n8n:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.40
    pids_limit: 256

  openwa:
    <<: *app-security
    image: ghcr.io/rmyndharis/openwa:0.10.0
    environment:
      NODE_ENV: production
      PORT: "2785"
      BASE_URL: http://openwa:2785
      CORS_ORIGINS: https://${FRONTEND_DOMAIN}
      DATABASE_TYPE: sqlite
      ENGINE_TYPE: baileys
      SESSION_DATA_PATH: /app/data/sessions
      BAILEYS_AUTH_DIR: /app/data/baileys
      BAILEYS_SYNC_FULL_HISTORY: "false"
      RESOLVE_LID_TO_PHONE: "true"
      AUTO_START_SESSIONS: "true"
      MAX_CONCURRENT_SESSIONS: "10"
      API_MASTER_KEY: ${OPENWA_API_KEY}
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER}
      ENABLE_SWAGGER: "false"
      WEBHOOK_SSRF_PROTECT: "true"
      WEBHOOK_MAX_RETRIES: "3"
      WEBHOOK_RETRY_DELAY: "1000"
      WEBHOOK_TIMEOUT: "10000"
    expose:
      - "2785"
    volumes:
      - openwa-data:/app/data
    networks:
      - private
      - openwa-egress
    mem_limit: 2g
    cpus: 0.80
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2785/api/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  volume-backup:
    <<: *app-security
    image: restic/restic:0.18.1
    profiles:
      - maintenance
    environment:
      RESTIC_REPOSITORY: s3:${DATABASE_BACKUP_R2_ENDPOINT_URL}/${DATABASE_BACKUP_R2_BUCKET}/oracle-volumes
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${DATABASE_BACKUP_R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${DATABASE_BACKUP_R2_SECRET_ACCESS_KEY}
    volumes:
      - openwa-data:/data/openwa:ro
      - n8n-data:/data/n8n:ro
      - legacy-artifacts:/data/legacy-artifacts:ro
      - restic-cache:/root/.cache/restic
    networks:
      - backup-egress
    mem_limit: 384m
    cpus: 0.30
    pids_limit: 128

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true
  worker-egress:
    driver: bridge
  runner-egress:
    driver: bridge
  openwa-egress:
    driver: bridge
  backup-egress:
    driver: bridge

volumes:
  caddy-data:
    name: svontai-caddy-data
  caddy-config:
    name: svontai-caddy-config
  postgres-data:
    name: svontai-postgres-data
  redis-data:
    name: svontai-redis-data
  n8n-data:
    name: svontai-n8n-data
  openwa-data:
    name: svontai-openwa-data
  legacy-artifacts:
    name: svontai-legacy-artifacts
  restic-cache:
    name: svontai-restic-cache
